map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 4992;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:4991;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_redirect ~*^http://common\.localhost/#(.*)$ http://common.localhost/sharkord/#$1;
        proxy_redirect ~*^http://common\.localhost/\?(.*)$ http://common.localhost/sharkord/?$1;
    }
}

server {
    listen 127.0.0.1:80;
    server_name _;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host common.localhost;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-Proto http;
        proxy_redirect off;
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'http://127.0.0.1/auth/realms/common/' 'http://common.localhost/auth/realms/common/';
    }
}
